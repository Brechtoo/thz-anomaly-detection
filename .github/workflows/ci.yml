name: CI

on:
  push:
    branches:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Ruff from development requirements
        run: |
          grep '^ruff==' requirements-dev.txt > /tmp/ruff-requirements.txt
          python -m pip install -r /tmp/ruff-requirements.txt
      - run: python -m ruff check .

  tests:
    name: pytest (synthetic data, Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MLFLOW_ENABLE_ARTIFACTS_PROGRESS_BAR: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test and comparison dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-comparison.txt
      - name: Run all tests, including feature, split, integrity and ML smoke tests
        env:
          MLFLOW_TRACKING_URI: sqlite:///${{ runner.temp }}/mlflow.db
        run: python -m pytest -q -ra
